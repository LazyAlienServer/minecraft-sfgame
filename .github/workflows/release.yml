name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          else
            BASE_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            VERSION="${BASE_VERSION}-build.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
            TAG="v${VERSION}"
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Test and build release JAR
        run: ./gradlew test build --no-daemon --stacktrace "-Pmod_version=${{ steps.version.outputs.version }}"

      - name: Verify release JAR
        shell: bash
        run: test -f "build/libs/sfgame-${{ steps.version.outputs.version }}.jar"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SFGame v${{ steps.version.outputs.version }}
          files: build/libs/sfgame-${{ steps.version.outputs.version }}.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ steps.version.outputs.prerelease }}
